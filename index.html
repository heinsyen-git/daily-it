<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laporan Harian IT</title>
<meta name="theme-color" content="#0B6E78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Laporan IT">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230B6E78'/><text x='32' y='42' font-family='Arial' font-weight='700' font-size='26' fill='white' text-anchor='middle'>IT</text></svg>">
<style>
  html,body{margin:0;height:100%;background:#E9EDF1;font-family:Arial,Helvetica,sans-serif;color:#17222D}
  .box{height:100%;display:grid;place-items:center;text-align:center;padding:24px}
  .logo{width:56px;height:56px;border-radius:14px;background:#0B6E78;color:#fff;display:grid;place-items:center;font-weight:700;font-size:22px;margin:0 auto 14px}
  .spin{width:22px;height:22px;border:3px solid #0B6E78;border-right-color:transparent;border-radius:50%;margin:16px auto;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  a{display:inline-block;margin-top:6px;background:#0B6E78;color:#fff;text-decoration:none;padding:11px 18px;border-radius:10px;font-weight:700}
</style>
</head>
<body>
<div class="box"><div>
  <div class="logo">IT</div>
  <b>Membuka Laporan Harian IT…</b>
  <div class="spin"></div>
  <a id="go">Buka aplikasi</a>
</div></div>
<script>
  // Link Web App Apps Script (yang berakhiran /exec)
  const APP_URL = "https://script.google.com/macros/s/AKfycbwRG6sTokhK1X0WQjIjrOYcM_pjLysyPiiTBgZktAo_mj_GWlyMkzB5BkOg7a4RVMBu/exec";
  document.getElementById("go").href = APP_URL;
  location.replace(APP_URL);   // langsung pindah ke aplikasi (tanpa iframe, jadi tidak kena error akun/cookie Google)
</script>
</body>
</html>
